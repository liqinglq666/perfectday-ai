name: PerfectDay CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit dependency lockfile if needed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: lock dependency graph" || exit 0
          git push origin HEAD:main

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Regression tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Verify rendered journey flow
        run: npm run test:flow
