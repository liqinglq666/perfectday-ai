    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf4f5"/><stop offset="1" stop-color="#b6c7c8"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eee8dc"/><stop offset="1" stop-color="#c8b79d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#4a3925" flood-opacity=".16"/></filter>
